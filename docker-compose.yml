services:
  db:
    image: postgres:16
    container_name: iflower-db
    environment:
      POSTGRES_DB: iflower
      POSTGRES_USER: iflower
      POSTGRES_PASSWORD: iflower
    ports:
      - "5432:5432"
    volumes:
      - iflower-data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d

volumes:
  iflower-data:
