spring.application.name=iflower
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/iflower}
spring.datasource.username=${DB_USER:iflower}
spring.datasource.password=${DB_PASSWORD:iflower}

# validate: o schema é controlado pelos scripts em /database (não pelo Hibernate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT (em produção, definir JWT_SECRET com no mínimo 32 caracteres)
iflower.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
iflower.jwt.expiracao-segundos=7200
